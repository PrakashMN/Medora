<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&amp;display=swap');
    </style>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="30%" stop-color="#b0b0b0"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="70%" stop-color="#a0a0a0"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </linearGradient>
    <linearGradient id="labsGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#40e0d0"/>
      <stop offset="50%" stop-color="#4090d0"/>
      <stop offset="80%" stop-color="#6060c0"/>
      <stop offset="100%" stop-color="#8040a0"/>
    </linearGradient>
  </defs>
  
  <!-- THEMONSTER -->
  <text x="400" y="95" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="85" font-weight="800" fill="url(#metalGrad)" letter-spacing="6">THEMONSTER</text>
  
  <!-- .LABS with gradient -->
  <text x="400" y="165" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="70" font-weight="700" fill="url(#labsGrad)" letter-spacing="12">.LABS</text>
</svg>
