<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;display=swap');
      .l-teal { fill: #20a69a; font-family: 'Nunito', sans-serif; font-weight: 800; }
      .l-blue { fill: #0076a8; font-family: 'Nunito', sans-serif; font-weight: 700; }
      .gradient-sun { fill: url(#sunGradient); }
    </style>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#fdc940" />
      <stop offset="100%" stop-color="#f05a28" />
    </radialGradient>
  </defs>
  
  <!-- Icon Left: Cross + Swan -->
  <g transform="translate(10, 20)">
    <!-- Vertical Cross -->
    <rect x="100" y="0" width="60" height="240" fill="#20a69a" />
    <!-- Horizontal Cross -->
    <rect x="0" y="90" width="240" height="60" fill="#20a69a" />
    
    <!-- Swan Base / Water -->
    <path d="M 0 180 C 40 130, 80 140, 110 180 C 130 210, 80 260, 0 240 Z" fill="#0076a8" />
    <path d="M 30 240 C 60 190, 80 210, 90 240 Z" fill="#20a69a" />
    <!-- Swan Neck -->
    <path d="M 110 180 C 60 120, 100 80, 140 80 C 160 80, 170 100, 170 140 C 170 180, 150 200, 150 240 L 165 240 C 180 180, 200 130, 170 80 C 140 30, 90 60, 80 110 C 70 150, 80 180, 100 240 L 115 240 C 105 200, 130 190, 110 180 Z" fill="#ffffff" />
    <!-- Eye -->
    <circle cx="163" cy="115" r="2" fill="#20a69a"/>
    <!-- Beak -->
    <polygon points="168,125 180,140 172,135" fill="#ffffff"/>
  </g>
  
  <!-- "BHS" Top Text -->
  <text x="270" y="60" class="l-blue" font-size="45">BHS</text>
  
  <!-- "Lakeview" Main Text -->
  <text x="270" y="195" class="l-teal" font-size="160" letter-spacing="2">Lakeview</text>
  
  <!-- Sun Dot over the 'i' -->
  <!-- 'i' is positioned roughly at x=650 based on font spacing -->
  <circle cx="682" cy="70" r="22" class="gradient-sun" />
  
  <!-- Horizontal Separator Line -->
  <line x1="270" y1="215" x2="880" y2="215" stroke="#20a69a" stroke-width="4" />
  
  <!-- "HOSPITAL" Bottom Text -->
  <text x="270" y="275" class="l-blue" font-size="65" letter-spacing="8">HOSPITAL</text>
</svg>
