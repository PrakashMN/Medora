<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&amp;display=swap');
      .k-blue { fill: #0F75BC; font-family: 'Oswald', sans-serif; }
    </style>
  </defs>
  
  <!-- Triangle Icon -->
  <polygon points="120,40 20,220 220,220" fill="#0F75BC" />
  
  <g fill="#ffffff">
    <!-- Star top -->
    <path d="M 120 60 L 125 80 L 145 85 L 125 90 L 120 110 L 115 90 L 95 85 L 115 80 Z" />
    <path d="M 140 100 L 143 110 L 153 113 L 143 116 L 140 126 L 137 116 L 127 113 L 137 110 Z" fill="#ffffff" opacity="0.8"/>
    
    <!-- Profile silhouette -->
    <path d="M 110 110 C 120 100, 140 110, 140 130 C 150 130, 160 140, 155 150 C 160 160, 165 170, 150 180 L 140 190 C 120 200, 90 190, 80 170 C 70 150, 80 120, 100 110 Z" />
    
    <!-- Chalice Base overlay -->
    <path d="M 70 190 C 70 210, 170 210, 170 190 Z" />
    <path d="M 60 185 L 180 185 L 175 180 L 65 180 Z" />
    
    <!-- Inner lines of Chalice -->
    <path d="M 90 180 L 90 160 C 90 140, 150 140, 150 160 L 150 180 Z" fill="none" stroke="#fff" stroke-width="6"/>
  </g>
  
  <!-- Text: KLE (Only KLE this time) -->
  <text x="250" y="220" class="k-blue" font-size="240" font-weight="700" letter-spacing="-2">KLE</text>
</svg>
