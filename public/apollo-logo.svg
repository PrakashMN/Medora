<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;display=swap');
      .a-teal { fill: #1a8a8a; font-family: 'Montserrat', sans-serif; }
      .a-dark { fill: #0c5c6b; font-family: 'Montserrat', sans-serif; }
    </style>
    <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="60%" stop-color="#f7c948"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  
  <!-- Shield / Building Shape -->
  <g transform="translate(100, 10)">
    <!-- Main shield block -->
    <rect x="50" y="40" width="100" height="120" fill="#1a8a8a" rx="4"/>
    <!-- Left wing -->
    <polygon points="20,80 50,60 50,160 20,140" fill="#1a8a8a"/>
    <!-- Right roof -->
    <polygon points="150,60 180,80 180,140 150,160" fill="#1a8a8a"/>
    <!-- Cross on shield -->
    <rect x="90" y="60" width="20" height="50" fill="#ffffff" rx="2"/>
    <rect x="75" y="75" width="50" height="20" fill="#ffffff" rx="2"/>
    <!-- Face silhouette cutout -->
    <path d="M 95 120 C 85 110, 80 130, 85 145 C 90 155, 100 160, 110 155 C 120 150, 125 140, 120 130 C 115 120, 105 110, 95 120 Z" fill="#ffffff" opacity="0.6"/>
    <!-- Torch / Flame -->
    <rect x="92" y="10" width="16" height="40" fill="#1a8a8a" rx="3"/>
    <path d="M 100 10 C 85 -15, 95 -30, 100 -40 C 105 -30, 115 -15, 100 10 Z" fill="url(#flameGrad)"/>
    <path d="M 100 5 C 92 -10, 98 -20, 100 -28 C 102 -20, 108 -10, 100 5 Z" fill="#fde68a" opacity="0.8"/>
  </g>

  <!-- Text: Apollo -->
  <text x="200" y="250" text-anchor="middle" class="a-teal" font-size="85" font-weight="800">Apollo</text>
  
  <!-- Text: HOSPITALS -->
  <text x="200" y="310" text-anchor="middle" class="a-dark" font-size="50" font-weight="700" letter-spacing="2">HOSPITALS</text>
</svg>
